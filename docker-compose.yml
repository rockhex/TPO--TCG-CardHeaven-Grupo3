services:
  db:
    image: postgres:16
    container_name: tcgtrader-db
    environment:
      POSTGRES_DB: tcgtrader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tcgtrader_data:/var/lib/postgresql/data

volumes:
  tcgtrader_data:
